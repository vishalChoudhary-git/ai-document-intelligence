[project]
name = "ai-document-intelligence"
version = "0.1.0"
description = "A production-ready Python SDK for intelligent PDF parsing for LLM applications."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

authors = [
    { name = "Vishal Choudhary" }
]

dependencies = [
    "pymupdf>=1.26.0",
    "pydantic>=2.11.0"
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "ruff>=0.12.0",
    "mypy>=1.17.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["fitz"]
ignore_missing_imports = true